# Entrega contínua: a cada push na main (ou seja, a cada release ou hotfix
# mesclado), testa, gera o build e publica a pasta dist/ no GitHub Pages.
# Se os testes ou o build falharem, nada é publicado e o site continua na
# versão anterior.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite publicar de novo manualmente pela aba Actions

permissions:
  contents: read
  pages: write      # publicar no Pages
  id-token: write   # autenticação do deploy

# Um deploy por vez; um novo push espera o anterior terminar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar a pasta dist/ como artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
